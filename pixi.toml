[workspace]
authors = ["Str-Gen <20303842+Str-Gen@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "pyroquet-next"
platforms = ["linux-64"]
version = "0.1.0"
preview = ["pixi-build"]

[tasks]
test-nested-table = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_nested_table.mojo"
generate-nested-fixtures = "build/oracle-uv/bin/python tests/nested_fixture_oracle.py --generate"
test-nested-levels = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_nested_levels.mojo"
test-nested-read = { cmd = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_nested_read.mojo", depends-on = ["generate-nested-fixtures"] }
test-nested-write = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_nested_write.mojo"
test-delta = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_delta.mojo"
test-delta-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src -I ../NuMojo tests/test_delta.mojo -o build/test-delta-all && build/test-delta-all"
test-delta-noassert = "mkdir -p build && mojo build -O3 -D ASSERT=none -I src -I ../NuMojo tests/test_delta.mojo -o build/test-delta-none && build/test-delta-none"
generate-gzip-fixtures = "build/oracle-uv/bin/python tests/gzip_fixture_oracle.py --generate"
test-gzip-writes = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_gzip_writes.mojo"
test-gzip-reads = { cmd = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_gzip_reads.mojo", depends-on = ["generate-gzip-fixtures"] }
test-packed-validity = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_packed_validity.mojo"
test-packed-validity-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src -I ../NuMojo tests/test_packed_validity.mojo -o build/test-packed-validity && build/test-packed-validity"
test-packed-validity-noassert = "mkdir -p build && mojo build -O3 -D ASSERT=none -I src -I ../NuMojo tests/test_packed_validity.mojo -o build/test-packed-validity-noassert && build/test-packed-validity-noassert"
test-nullable-dictionary = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_nullable_dictionary.mojo"
test-nullable-dictionary-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src -I ../NuMojo tests/test_nullable_dictionary.mojo -o build/test-nullable-dictionary && build/test-nullable-dictionary"
test-nullable-dictionary-noassert = "mkdir -p build && mojo build -O3 -D ASSERT=none -I src -I ../NuMojo tests/test_nullable_dictionary.mojo -o build/test-nullable-dictionary-noassert && build/test-nullable-dictionary-noassert"
test-dictionary-gather = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_dictionary_gather.mojo"
test-dictionary-gather-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src -I ../NuMojo tests/test_dictionary_gather.mojo -o build/test-dictionary-gather && build/test-dictionary-gather"
test-dictionary-gather-noassert = "mkdir -p build && mojo build -O3 -D ASSERT=none -I src -I ../NuMojo tests/test_dictionary_gather.mojo -o build/test-dictionary-gather-noassert && build/test-dictionary-gather-noassert"
test-snappy-pages = "mojo run -D ASSERT=all -I src tests/test_snappy_pages.mojo"
test-snappy-pages-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src tests/test_snappy_pages.mojo -o build/test-snappy-pages && build/test-snappy-pages"
test-snappy-pages-noassert = "mkdir -p build && mojo build -O3 -D ASSERT=none -I src tests/test_snappy_pages.mojo -o build/test-snappy-pages-noassert && build/test-snappy-pages-noassert"
test-decoder-bulk = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_decoder_bulk.mojo"
test-decoder-bulk-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src -I ../NuMojo tests/test_decoder_bulk.mojo -o build/test-decoder-bulk && build/test-decoder-bulk"
test-decoder-dictionary = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_decoder_dictionary.mojo"
test-decoder-dictionary-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src -I ../NuMojo tests/test_decoder_dictionary.mojo -o build/test-decoder-dictionary && build/test-decoder-dictionary"
test-binary = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_binary_column.mojo && mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_boolean_column.mojo && mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_binary_values.mojo && mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_binary_io.mojo"
test-binary-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src -I ../NuMojo tests/test_binary_column.mojo -o build/test-binary-column && build/test-binary-column && mojo build -O3 -D ASSERT=all -I src -I ../NuMojo tests/test_boolean_column.mojo -o build/test-boolean-column && build/test-boolean-column && mojo build -O3 -D ASSERT=all -I src -I ../NuMojo tests/test_binary_values.mojo -o build/test-binary-values && build/test-binary-values && mojo build -O3 -D ASSERT=all -I src -I ../NuMojo tests/test_binary_io.mojo -o build/test-binary-io && build/test-binary-io"
test-hybrid = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_hybrid.mojo"
test-hybrid-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src -I ../NuMojo tests/test_hybrid.mojo -o build/test-hybrid && build/test-hybrid"
test-table-write = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_table_write.mojo"
test-table-write-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src -I ../NuMojo tests/test_table_write.mojo -o build/test-table-write && build/test-table-write"
test-numeric-write = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_numeric_write.mojo"
test-numeric-write-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src -I ../NuMojo tests/test_numeric_write.mojo -o build/test-numeric-write && build/test-numeric-write"
test-publication = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_publication.mojo"
test-publication-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src -I ../NuMojo tests/test_publication.mojo -o build/test-publication && build/test-publication"
check = { depends-on = ["test-nested-table", "test-nested-levels", "test-nested-read", "test-nested-write", "smoke", "test-storage", "test-table", "test-compact", "test-metadata", "test-pages", "test-packed-validity", "test-snappy-pages", "test-hybrid", "test-delta", "test-decoder-bulk", "test-decoder-dictionary", "test-dictionary-gather", "test-nullable-dictionary", "test-numojo", "test-publication", "test-numeric-write", "test-table-write", "test-binary"] }
test-numojo = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_numojo.mojo"
test-numojo-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src -I ../NuMojo tests/test_numojo.mojo -o build/test-numojo && build/test-numojo"
test-pages = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_pages.mojo"
test-pages-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src -I ../NuMojo tests/test_pages.mojo -o build/test-pages && build/test-pages"
test-metadata = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_metadata.mojo"
test-metadata-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src -I ../NuMojo tests/test_metadata.mojo -o build/test-metadata && build/test-metadata"
test-compact = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_compact.mojo"
test-compact-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src -I ../NuMojo tests/test_compact.mojo -o build/test-compact && build/test-compact"
package-compact = "mkdir -p build && mojo precompile src/compact_protocol -o build/compact_protocol.mojoc"
test-table = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_table.mojo"
test-table-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src -I ../NuMojo tests/test_table.mojo -o build/test-table && build/test-table"
smoke = "mojo run -I src -I ../NuMojo tests/smoke.mojo"
test-storage = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_storage.mojo"
test-storage-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src -I ../NuMojo tests/test_storage.mojo -o build/test-storage && build/test-storage"
build = "mkdir -p build && mojo build -I src -I ../NuMojo tests/smoke.mojo -o build/smoke"
package = "mkdir -p build && mojo precompile -I src -I ../NuMojo src/pyroquet -o build/pyroquet.mojoc"
format = "mojo format src tests examples"

[dependencies]
mojo-snappy = { path = "../mojo-snappy" }
mojo = "==1.0.0"
libzlib = "==1.3.2"

[activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib"
