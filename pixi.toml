[workspace]
authors = ["Str-Gen <20303842+Str-Gen@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "pyroquet-next"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
test-numeric-write = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_numeric_write.mojo"
test-numeric-write-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src -I ../NuMojo tests/test_numeric_write.mojo -o build/test-numeric-write && build/test-numeric-write"
test-publication = "mojo run -D ASSERT=all -I src tests/test_publication.mojo"
test-publication-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src tests/test_publication.mojo -o build/test-publication && build/test-publication"
check = { depends-on = ["smoke", "test-storage", "test-table", "test-compact", "test-metadata", "test-pages", "test-numojo", "test-publication", "test-numeric-write"] }
test-numojo = "mojo run -D ASSERT=all -I src -I ../NuMojo tests/test_numojo.mojo"
test-numojo-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src -I ../NuMojo tests/test_numojo.mojo -o build/test-numojo && build/test-numojo"
test-pages = "mojo run -D ASSERT=all -I src tests/test_pages.mojo"
test-pages-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src tests/test_pages.mojo -o build/test-pages && build/test-pages"
test-metadata = "mojo run -D ASSERT=all -I src tests/test_metadata.mojo"
test-metadata-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src tests/test_metadata.mojo -o build/test-metadata && build/test-metadata"
test-compact = "mojo run -D ASSERT=all -I src tests/test_compact.mojo"
test-compact-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src tests/test_compact.mojo -o build/test-compact && build/test-compact"
package-compact = "mkdir -p build && mojo precompile src/compact_protocol -o build/compact_protocol.mojoc"
test-table = "mojo run -D ASSERT=all -I src tests/test_table.mojo"
test-table-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src tests/test_table.mojo -o build/test-table && build/test-table"
smoke = "mojo run -I src tests/smoke.mojo"
test-storage = "mojo run -D ASSERT=all -I src tests/test_storage.mojo"
test-storage-release = "mkdir -p build && mojo build -O3 -D ASSERT=all -I src tests/test_storage.mojo -o build/test-storage && build/test-storage"
build = "mkdir -p build && mojo build -I src tests/smoke.mojo -o build/smoke"
package = "mkdir -p build && mojo precompile -I src -I ../NuMojo src/pyroquet -o build/pyroquet.mojoc"
format = "mojo format src tests examples"

[dependencies]
mojo = "==1.0.0"
