[workspace]
authors = ["Str-Gen <20303842+Str-Gen@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max", "conda-forge", "https://repo.prefix.dev/modular-community"]
name = "pyroquet"
platforms = ["linux-64"]
version = "0.1.1"
preview = ["pixi-build"]

[tasks]
conda-build = "pixi exec --spec rattler-build==0.76.1 -- rattler-build build --recipe conda.recipe/recipe.yaml --output-dir build/conda -c https://conda.modular.com/max -c conda-forge -c https://repo.prefix.dev/modular-community"
check-release = "build/oracle-uv/bin/python tests/release/run.py"
check-release-large = "build/oracle-uv/bin/python tests/release/run.py --large"
generate-float16-fixtures = "build/oracle-uv/bin/python tests/float16_fixture_oracle.py --generate"
test-float16 = { cmd = "mojo run -D ASSERT=all -I src tests/test_float16.mojo", depends-on = ["generate-float16-fixtures"] }
test-zstd = "mojo run -D ASSERT=all -I src tests/test_zstd.mojo"
test-numeric-mutation = "mojo run -D ASSERT=all -I src tests/test_numeric_mutation.mojo"
test-failure-propagation = "python tests/check_test_failures.py"
test-enum-column = "mojo run -D ASSERT=all -I src tests/test_enum_column.mojo"
generate-enum-fixtures = "build/oracle-uv/bin/python tests/enum_fixture_oracle.py --generate"
test-enum-io = { cmd = "mojo run -D ASSERT=all -I src tests/test_enum_io.mojo", depends-on = ["generate-enum-fixtures"] }
test-enum-nested = { cmd = "mojo run -D ASSERT=all -I src tests/test_enum_nested.mojo", depends-on = ["generate-enum-fixtures"] }
test-enums = { depends-on = ["test-enum-column", "test-enum-io", "test-enum-nested"] }
test-string-column = "mojo run -D ASSERT=all -I src tests/test_string_column.mojo"
generate-string-fixtures = "build/oracle-uv/bin/python tests/string_fixture_oracle.py --generate"
test-string-io = { cmd = "mojo run -D ASSERT=all -I src tests/test_string_io.mojo", depends-on = ["generate-string-fixtures"] }
test-string-nested = { cmd = "mojo run -D ASSERT=all -I src tests/test_string_nested.mojo", depends-on = ["generate-string-fixtures"] }
test-strings = { depends-on = ["test-string-column", "test-string-io", "test-string-nested"] }
test-nested-table = "mojo run -D ASSERT=all -I src tests/test_nested_table.mojo"
generate-nested-fixtures = "build/oracle-uv/bin/python tests/nested_fixture_oracle.py --generate"
test-nested-levels = "mojo run -D ASSERT=all -I src tests/test_nested_levels.mojo"
test-nested-read = { cmd = "mojo run -D ASSERT=all -I src tests/test_nested_read.mojo", depends-on = ["generate-nested-fixtures"] }
test-nested-write = "mojo run -D ASSERT=all -I src tests/test_nested_write.mojo"
test-delta = "mojo run -D ASSERT=all -I src tests/test_delta.mojo"
generate-gzip-fixtures = "build/oracle-uv/bin/python tests/gzip_fixture_oracle.py --generate"
test-gzip-writes = "mojo run -D ASSERT=all -I src tests/test_gzip_writes.mojo"
test-gzip-reads = { cmd = "mojo run -D ASSERT=all -I src tests/test_gzip_reads.mojo", depends-on = ["generate-gzip-fixtures"] }
test-packed-validity = "mojo run -D ASSERT=all -I src tests/test_packed_validity.mojo"
test-nullable-dictionary = "mojo run -D ASSERT=all -I src tests/test_nullable_dictionary.mojo"
test-dictionary-gather = "mojo run -D ASSERT=all -I src tests/test_dictionary_gather.mojo"
test-snappy-pages = "mojo run -D ASSERT=all -I src tests/test_snappy_pages.mojo"
test-decoder-bulk = "mojo run -D ASSERT=all -I src tests/test_decoder_bulk.mojo"
test-decoder-dictionary = "mojo run -D ASSERT=all -I src tests/test_decoder_dictionary.mojo"
test-binary = "mojo run -D ASSERT=all -I src tests/test_binary_column.mojo && mojo run -D ASSERT=all -I src tests/test_boolean_column.mojo && mojo run -D ASSERT=all -I src tests/test_binary_values.mojo && mojo run -D ASSERT=all -I src tests/test_binary_io.mojo"
test-hybrid = "mojo run -D ASSERT=all -I src tests/test_hybrid.mojo"
test-table-write = "mojo run -D ASSERT=all -I src tests/test_table_write.mojo"
test-numeric-write = "mojo run -D ASSERT=all -I src tests/test_numeric_write.mojo"
test-publication = "mojo run -D ASSERT=all -I src tests/test_publication.mojo"
check = { depends-on = ["test-float16", "test-zstd", "test-numeric-mutation", "test-failure-propagation", "test-enums", "test-strings", "test-nested-table", "test-nested-levels", "test-nested-read", "test-nested-write", "smoke", "test-storage", "test-table", "test-compact", "test-metadata", "test-pages", "test-packed-validity", "test-snappy-pages", "test-hybrid", "test-delta", "test-decoder-bulk", "test-decoder-dictionary", "test-dictionary-gather", "test-nullable-dictionary", "test-numojo", "test-publication", "test-numeric-write", "test-table-write", "test-binary", "test-gzip-writes", "test-gzip-reads"] }
test-numojo = "mojo run -D ASSERT=all -I src tests/test_numojo.mojo"
test-pages = "mojo run -D ASSERT=all -I src tests/test_pages.mojo"
test-metadata = "mojo run -D ASSERT=all -I src tests/test_metadata.mojo"
test-compact = "mojo run -D ASSERT=all -I src tests/test_compact.mojo"
package-compact = "mkdir -p build && mojo precompile src/compact_protocol -o build/compact_protocol.mojoc"
test-table = "mojo run -D ASSERT=all -I src tests/test_table.mojo"
smoke = "mojo run -I src tests/smoke.mojo"
test-storage = "mojo run -D ASSERT=all -I src tests/test_storage.mojo"
package = "mkdir -p build && mojo precompile -I src src/pyroquet -o build/pyroquet.mojoc"
format = "mojo format src tests examples"

[dependencies]
mojo = "==1.1.0"
numojo = "==0.11.0"
mojo-snappy = "==0.2.0"
libzlib = "==1.3.2"
zstd = "==1.5.7"
max-core = "==26.6.0"

[activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib"
